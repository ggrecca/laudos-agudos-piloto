name: Prepare controlled PDF dependencies
on:
  push:
    branches: ["evolution/**"]
    paths: [".github/workflows/prepare-pdf.yml"]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Resolve pinned client-side PDF dependencies without scripts
        run: |
          pnpm add --save-exact --ignore-scripts jspdf@4.2.1 html2canvas@1.4.1
          node -e 'const fs=require("node:fs"); for(const [key,path] of [["PDF_PACKAGE","package.json"],["PDF_LOCK","pnpm-lock.yaml"]]) console.log(key+"="+JSON.stringify(fs.readFileSync(path,"utf8")))'
