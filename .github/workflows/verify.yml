name: Laudos Agudos verification
on:
  push:
    branches: [main, "evolution/**"]
    paths-ignore: ["docs/**", "README.md"]
concurrency:
  group: laudos-verification-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Create isolated local Supabase (never links production)
        run: |
          supabase init
          cp supabase/001_pilot.sql supabase/migrations/20260901000001_baseline.sql
          cp supabase/002_consumer_scope.sql supabase/migrations/20260901000002_consumer.sql
          cp supabase/003_security_hardening.sql supabase/migrations/20260901000003_security.sql
          mv supabase/migrations/20261002180915_official_product_evolution.sql /tmp/laudos-evolution.sql
          mv supabase/migrations/20261005225810_agudos_reference_reuse.sql /tmp/laudos-agudos-reference.sql
          mv supabase/migrations/20261006013239_password_workflows_and_pipeline.sql /tmp/laudos-password-pipeline.sql
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
          supabase status -o env > /tmp/laudos-local.env
          set -a
          source /tmp/laudos-local.env
          set +a
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/migration-legacy.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f /tmp/laudos-evolution.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f /tmp/laudos-agudos-reference.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f /tmp/laudos-password-pipeline.sql
      - name: Run database, Auth, RLS and browser flows
        run: |
          set -a
          source /tmp/laudos-local.env
          set +a
          export VITE_SUPABASE_URL="$API_URL"
          export VITE_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          supabase functions serve password-actions --no-verify-jwt > /tmp/laudos-functions.log 2>&1 &
          pnpm exec vite --host 127.0.0.1 > /tmp/laudos-vite.log 2>&1 &
          npm install --prefix /tmp/laudos-test playwright
          /tmp/laudos-test/node_modules/.bin/playwright install --with-deps chromium
          if ! command -v pdftoppm >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y poppler-utils; fi
          NODE_PATH=/tmp/laudos-test/node_modules node tests/verify.cjs
      - name: Verify mobile layouts and unchanged desktop pixels
        run: NODE_PATH=/tmp/laudos-test/node_modules node tests/mobile-ui.cjs
      - name: Verify published production UI (read-only)
        if: github.ref == 'refs/heads/main'
        run: NODE_PATH=/tmp/laudos-test/node_modules node tests/production-smoke.cjs
      - name: Preserve Edge Function diagnostic logs
        if: always()
        run: |
          mkdir -p test-results
          if [ -f /tmp/laudos-functions.log ]; then cp /tmp/laudos-functions.log test-results/password-edge-runtime.log; fi
          if [ -f /tmp/laudos-local.env ]; then set -a; source /tmp/laudos-local.env; set +a; node tests/auth-runtime-diagnostics.cjs; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: test-results/
